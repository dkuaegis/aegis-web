name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!AGENTS.md"
      - "!LICENSE"
      - "!.env.example"
      - "!.gitignore"
      - "!.github/**"
      - ".github/workflows/build_and_deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-deploy
  queue: max

jobs:
  build:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Calculate image reference
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "repository=$image"
            echo "tag=sha-$GITHUB_SHA"
            echo "full_tag=$image:sha-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: image_exists
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.full_tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        id: build
        if: steps.image_exists.outputs.value != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.full_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=aegis-web
          cache-to: type=gha,mode=max,scope=aegis-web

      - name: Resolve image digest
        id: digest
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          FULL_TAG: ${{ steps.image.outputs.full_tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}/versions
        run: |
          if [[ -n "$BUILT_DIGEST" ]]; then
            digest="$BUILT_DIGEST"
          else
            digest="$(docker buildx imagetools inspect "$FULL_TAG" --format '{{.Digest}}')"
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid image digest." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          {
            echo "### Container image"
            echo
            echo "- Package: [${PACKAGE_URL}](${PACKAGE_URL})"
            echo "- Digest: \`${IMAGE_REPOSITORY}@${digest}\`"
            echo "- Tag: \`${FULL_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR for image scanning
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ needs.build.outputs.image_repository }}@${{ needs.build.outputs.image_digest }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          timeout: 10m

      - name: Block images with CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ needs.build.outputs.image_repository }}@${{ needs.build.outputs.image_digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
          timeout: 10m

  deploy:
    needs:
      - build
      - scan
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Deploy image through Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          WAF_DEPLOY_TOKEN: ${{ secrets.WAF_DEPLOY_TOKEN }}
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        shell: bash
        run: bash scripts/deploy-coolify.sh
