name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!AGENTS.md"
      - "!LICENSE"
      - "!.env.example"
      - "!.gitignore"
      - "!.github/**"
      - ".github/workflows/build_and_deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-deploy
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: 이미지 태그 계산
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "repository=$image"
            echo "tag=sha-$GITHUB_SHA"
            echo "full_tag=$image:sha-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 기존 이미지 확인
        id: image_exists
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.full_tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 이미지 빌드 및 GHCR 게시
        id: build
        if: steps.image_exists.outputs.value != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.full_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=aegis-web
          cache-to: type=gha,mode=max,scope=aegis-web

      - name: 이미지 digest 요약 기록
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          FULL_TAG: ${{ steps.image.outputs.full_tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}/versions
        run: |
          if [[ -n "$BUILT_DIGEST" ]]; then
            digest="$BUILT_DIGEST"
          else
            digest="$(
              docker buildx imagetools inspect "$FULL_TAG" --format '{{json .Manifest}}' \
              | jq -r '.digest'
            )"
          fi

          {
            echo "### 컨테이너 이미지"
            echo
            echo "- Package: [${PACKAGE_URL}](${PACKAGE_URL})"
            echo "- Digest: \`${IMAGE_REPOSITORY}@${digest}\`"
            echo "- Tag: \`${FULL_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Coolify 이미지 배포
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        shell: bash
        run: |
          : "${COOLIFY_URL:?GitHub Environment secret COOLIFY_URL을 설정해 주세요}"
          : "${COOLIFY_APP_UUID:?GitHub Environment secret COOLIFY_APP_UUID를 설정해 주세요}"
          : "${COOLIFY_WRITE_TOKEN:?GitHub Environment secret COOLIFY_WRITE_TOKEN을 설정해 주세요}"
          : "${COOLIFY_DEPLOY_TOKEN:?GitHub Environment secret COOLIFY_DEPLOY_TOKEN을 설정해 주세요}"

          api_url="${COOLIFY_URL%/}/api/v1"
          image_update="$(jq -n \
            --arg name "$IMAGE_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            '{docker_registry_image_name: $name, docker_registry_image_tag: $tag}')"

          curl --fail --silent --show-error --output /dev/null \
            --request PATCH "$api_url/applications/$COOLIFY_APP_UUID" \
            --header "Authorization: Bearer $COOLIFY_WRITE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$image_update"

          curl --fail --silent --show-error --output /dev/null \
            --request POST "$api_url/deploy?uuid=$COOLIFY_APP_UUID" \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN"
