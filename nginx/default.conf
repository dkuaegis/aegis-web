server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Fingerprinted build assets must never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the application shell so it references the current
    # fingerprinted assets after a deployment. no-cache (not no-store) keeps
    # the back/forward cache working.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html; # React Router
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
