server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Fingerprinted build assets must never fall back to an HTML page.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the HTML documents so they reference the current
    # fingerprinted assets after a deployment. no-cache (not no-store) keeps
    # the back/forward cache working. index.html is the prerendered home page,
    # __spa-fallback.html the empty shell for every other route.
    location ~ ^/(index|__spa-fallback)\.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # "$uri/" serves index.html for "/"; React Router handles the rest.
        try_files $uri $uri/ /__spa-fallback.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
